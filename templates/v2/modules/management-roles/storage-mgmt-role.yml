# -- Prefix-based CloudFormation Service Role for Storage Management --
# Parent template must define parameters:
#   Prefix, PrefixUpper, S3BucketNameOrgPrefix, ServiceRolePath, RolePath,
#   PermissionsBoundaryArn, GroupNames, RoleNames, UserNames,
#   S3ModuleLocation, S3ModuleNamespace, S3ArtifactsBucket
# Parent template must define conditions:
#   UseS3BucketNameOrgPrefix, HasPermissionsBoundaryArn,
#   HasGroupNames, HasRoleNames, HasUserNames
# NOTE: AWS::Include does not support YAML shorthand tags (!Sub, !Ref, etc.)
#       All intrinsic functions must use long-form syntax (Fn::Sub, Ref, etc.)

# ---------------------------------------------------------------------------
# -- Prefix-based IAM Service Role --
# --
# When deploying a Storage Stack, it must be given a service role.
# --
# Practice The Principle of Least Privilege
# IAM policies should be scoped down to give only necessary actions on
# resources specific to this prefix.
# --

Type: AWS::IAM::Role
Properties:
  Path:
    Ref: ServiceRolePath
  RoleName:
    Fn::Sub: "${PrefixUpper}-CloudFormation-Service-Role-Storage-Management"
  Description:
    Fn::Sub: "Service Role to Create and Manage an AWS S3, DynamoDb, and application access policies under prefix ${Prefix}"
  PermissionsBoundary:
    Fn::If:
      - HasPermissionsBoundaryArn
      - Ref: PermissionsBoundaryArn
      - Ref: "AWS::NoValue"

  AssumeRolePolicyDocument:
    Statement:
    - Sid: "EventTrustPolicy"
      Effect: Allow
      Action: sts:AssumeRole
      Principal:
        Service:
        - cloudformation.amazonaws.com

  Policies:
  - PolicyName:
      Fn::Sub: "${PrefixUpper}-CloudFormation-Service-Role-Storage-Management-Policy"
    PolicyDocument:
      Version: "2012-10-17"
      Statement:

      - Sid: ManageEventRulesByResourcePrefix
        Effect: Allow
        Action:
        - events:PutTargets
        - events:RemoveTargets
        - events:PutRule
        - events:DeleteRule
        - events:DescribeRule
        - events:TagResource
        - events:UntagResource
        Resource:
        - Fn::Sub: "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Prefix}-*"

      - Sid: ManageCloudFormationStacksByResourcePrefix
        Effect: Allow
        Action:
        - cloudformation:*Stack*
        - cloudformation:CreateChangeSet
        - cloudformation:ExecuteChangeSet
        - cloudformation:DeleteChangeSet
        - cloudformation:DescribeChangeSet
        - cloudformation:GetTemplate
        - cloudformation:GetTemplateSummary
        Resource:
          Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-*"

      - Sid: AllowTransformOperations
        Effect: Allow
        Action:
        - cloudformation:CreateChangeSet
        Resource:
        - "arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31"
        - "arn:aws:cloudformation:*:aws:transform/LanguageExtensions"
        - "arn:aws:cloudformation:*:aws:transform/Include"

      - Sid: ManageBucketsByResourcePrefix
        Effect: Allow
        Action:
        - s3:*
        Resource:
        - Fn::Sub:
          - "arn:aws:s3:::${BucketPrefix}-*"
          - BucketPrefix:
              Fn::If:
                - UseS3BucketNameOrgPrefix
                - Fn::Sub: "${S3BucketNameOrgPrefix}-${Prefix}"
                - Fn::Sub: "${Prefix}"
        - Fn::Sub:
          - "arn:aws:s3:::${BucketPrefix}-*/*"
          - BucketPrefix:
              Fn::If:
                - UseS3BucketNameOrgPrefix
                - Fn::Sub: "${S3BucketNameOrgPrefix}-${Prefix}"
                - Fn::Sub: "${Prefix}"

      # == CloudWatch Alarms ==
      - Sid: "CloudWatchAlarmsLimitedCRUDThisDeploymentOnly"
        Action:
        - cloudwatch:PutMetricAlarm
        - cloudwatch:DeleteAlarm*
        - cloudwatch:TagResource
        - cloudwatch:UntagResource
        - cloudwatch:DescribeAlarms
        Effect: Allow
        Resource:
          - Fn::Sub: "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Prefix}-*"

      # == CloudWatch Logs ==
      - Sid: "LogGroupsLimitedCRUDThisDeploymentOnly"
        Action:
        - logs:DeleteLogGroup
        - logs:DeleteRetentionPolicy
        - logs:PutRetentionPolicy
        - logs:CreateLogGroup
        - logs:TagLogGroup # AWS is phasing out, replacing with TagResource
        - logs:UntagLogGroup # AWS is phasing out, replacing with UntagResource
        - logs:TagResource
        - logs:UntagResource
        - logs:ListTagsForResource
        - logs:DescribeLogGroups
        Effect: Allow
        Resource:
        - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-*"

      # ===================================================================
      # Read-only permissions (typically for resources created by other stacks)
      # ===================================================================

      - Sid: "LogGroupsListAll"
        Action:
        - logs:DescribeLogGroups
        - logs:ListTagsLogGroup
        - logs:ListTagsForResource
        Effect: Allow
        Resource: 
        - Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*" # cannot scope down to resource as this is a List, but actions are limited

      # == Lambda Function ==
      - Sid: "LambdaCRUDThisDeploymentOnly"
        Action:
        - lambda:*
        Effect: Allow
        Resource:
        - Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-*"
        - Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-*:*"
        - Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${Prefix}-*"
        - Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*"

      # == DynamoDb ==
      - Sid: "DynamoDbCRUDThisDeploymentOnly"
        Action:
        - dynamodb:*
        Effect: Allow
        Resource:
          - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-*"

      - Sid: PassAndDeleteWorkerRolesByResourcePrefix
        Effect: Allow
        Action:
        - iam:PassRole
        - iam:DeleteRole
        Resource:
          Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role${RolePath}${Prefix}-Worker-*"

      - Sid: IAMReadOnly
        Effect: Allow
        Action:
        - iam:Get*
        - iam:List*
        Resource: 
        - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/*"
        - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:policy/*"

      - Sid: ManageManagedPoliciesByResourcePrefix
        Effect: Allow
        Action:
        - iam:CreatePolicy
        - iam:DeletePolicy
        - iam:CreatePolicyVersion
        - iam:DeletePolicyVersion
        - iam:TagPolicy
        - iam:UntagPolicy
        Resource:
          Fn::Sub: "arn:aws:iam::${AWS::AccountId}:policy${RolePath}${Prefix}-*"

      - Sid: ManageWorkerRolesByResourcePrefix
        Effect: Allow
        Action:
        - iam:AttachRolePolicy
        - iam:CreateRole
        - iam:DeleteRolePolicy
        - iam:DetachRolePolicy
        - iam:PutRolePolicy
        - iam:UpdateRoleDescription
        Resource:
          Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role${RolePath}${Prefix}-Worker-*"
        Condition: 
          Fn::If:
            - HasPermissionsBoundaryArn
            - StringEquals:
                "iam:PermissionsBoundary":
                  Ref: PermissionsBoundaryArn
            - Ref: "AWS::NoValue"

      - Sid: TagWorkerRolesByResourcePrefix
        Effect: Allow
        Action:
        - iam:TagRole
        - iam:UntagRole
        Resource:
          Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role${RolePath}${Prefix}-Worker-*"

      - Sid: InspectServiceRole
        Effect: Allow
        Action:
        - iam:ListAttachedRolePolicies
        Resource:
          Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role${ServiceRolePath}${PrefixUpper}-CloudFormation-Service-Role-*"

      - Sid: ArtifactBucketGetObjectForManagedStacks
        Effect: Allow
        Action:
          - s3:GetObject
          - s3:GetObjectVersion
        Resource:
          Fn::Sub: "arn:aws:s3:::${S3ArtifactsBucket}/${Prefix}-*"

      - Sid: S3ModuleBucketGetObject
        Effect: Allow
        Action:
          - s3:GetObject
          - s3:GetObjectVersion
        Resource:
          - Fn::Sub: "arn:aws:s3:::${S3ModuleLocation}/${S3ModuleNamespace}/*"

      - Sid: S3ModuleBucketListByNamespace
        Effect: Allow
        Action:
          - s3:ListBucket
        Resource:
          - Fn::Sub: "arn:aws:s3:::${S3ModuleLocation}"
        Condition:
          StringLike:
            s3:prefix:
              - Fn::Sub: "${S3ModuleNamespace}/*"
