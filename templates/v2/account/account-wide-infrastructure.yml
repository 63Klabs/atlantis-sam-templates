AWSTemplateFormatVersion: "2010-09-09"
Description: "Account-wide resources: ABAC-scoped managed policies and shared connections - Assembled from reusable modules"

# 63Klabs Atlantis DevOps Platform for AWS SAM Deployments
# Account-Wide Infrastructure Template
# Author: Chad Kluck - 63klabs.net
# Version: v2.1.0/2026-09-23

# Documentation, Issues/Feature Requests, Latest Updates, and Security Reports on GitHub:
# https://github.com/63klabs/atlantis-sam-templates/

# This template assembles account-wide resources for project pipelines from
# reusable modules (snippets) stored in S3. It includes:
#   - ABAC-scoped managed policies for CloudFormation service roles
#   - Shared connections (e.g., GitHub via CodeConnections)
#   - API Gateway CloudWatch logging prerequisites (account-level IAM role)
#   - Bedrock model invocation logging prerequisites (log group + IAM role)
#
# Managed policies are scoped via ABAC using the
# atlantis:ApplicationDeploymentId tag on the principal. The resulting
# managed policy ARNs are exported so that pipeline templates can attach
# them to their CloudFormation service roles.
#
# Each snippet references parameters from this template. Policy snippets
# use OrgPrefix and RolePath. Account-Wide snippets use OrgPrefix and
# service-specific parameters (e.g., GitHubOrg).
#
# BEDROCK MODEL INVOCATION LOGGING - MANUAL ACTIVATION REQUIRED
# -------------------------------------------------------------
# When EnableBedrockInvocationLogs is 'true', this template creates the
# CloudWatch log group and the IAM role that Amazon Bedrock needs in order to
# publish model invocation logs. Deploying this stack does NOT turn logging on.
# Model invocation logging remains DISABLED until you run the activation command
# below.
#
# Why: Amazon Bedrock exposes its model invocation logging configuration only
# through the PutModelInvocationLoggingConfiguration API. Unlike API Gateway
# (AWS::ApiGateway::Account), there is no CloudFormation resource for it. This
# template deliberately avoids a Lambda-backed custom resource, so activation is
# a one-time manual step per account, per region.
#
# After deployment, run (substituting the stack output values):
#
#   aws bedrock put-model-invocation-logging-configuration \
#     --region <REGION> \
#     --logging-config '<BedrockModelInvocationLoggingEnableCommand output>'
#
# Where the output BedrockModelInvocationLoggingEnableCommand already contains
# the log group name (BedrockModelInvocationLogGroupName) and role ARN
# (BedrockCloudWatchLogsRoleArn) substituted for you.
#
# Verify with:
#   aws bedrock get-model-invocation-logging-configuration --region <REGION>
#
# Repeat in every region where Bedrock is used. Text and embedding delivery are
# always enabled. Image and video (large binary) delivery are disabled by default;
# set EnableBedrockLargeObjectLogging to 'true' to deliver them to S3 under the
# 'bedrock/' prefix (see the S3 Bedrock Large Object Logs parameters and docs).
#
# Full instructions: docs/admin-ops/bedrock-model-invocation-logging.md
# AWS docs: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html

# =============================================================================
# META DATA
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-interface.html
#

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - E3001 # Resource Type property is defined inside AWS::Include modules
        - E3005 # Resource names resolved at deploy time via AWS::Include transforms
        - E6101 # Resources from AWS::Include modules are not visible to cfn-lint
        - W2001 # Parameters consumed by AWS::Include modules appear unused
        - W8001 # Conditions consumed by AWS::Include modules appear unused
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Organization Naming"
        Parameters:
          - OrgPrefix
      -
        Label:
          default: "IAM Configuration"
        Parameters:
          - RolePath
      -
        Label:
          default: "GitHub Connection"
        Parameters:
          - GitHubOrg
      -
        Label:
          default: "API Gateway"
        Parameters:
          - EnableApiGwCloudWatchLogs
      -
        Label:
          default: "S3 Artifacts Bucket"
        Parameters:
          - EnableS3ArtifactsBucket
          - S3BucketNameOrgPrefix
          - S3LogBucketName
      -
        Label:
          default: "S3 Access Log Bucket"
        Parameters:
          - EnableS3AccessLogBucket
          - LogExpirationInDays
          - S3AccessLogExpirationInDays
          - AllowLegacyCloudFrontLogs
      -
        Label:
          default: "Bedrock Model Invocation Logs"
        Parameters:
          - EnableBedrockInvocationLogs
          - BedrockInvocationLogExpirationInDays
          - BedrockInvocationLogKmsKeyArn
      -
        Label:
          default: "S3 Bedrock Large Object Logs"
        Parameters:
          - EnableBedrockLargeObjectLogging
          - BedrockLargeObjectLogExpirationInDays
          - BedrockLargeObjectLogBucketName
      -
        Label:
          default: "Promotion"
        Parameters:
          - PromotionSourceAccountIds
          - EnablePromotionTrigger
      -
        Label:
          default: "Module Source"
        Parameters:
          - S3ModuleLocation
          - S3ModuleNamespace

# =============================================================================
# PARAMETERS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/parameters-section-structure.html
#

Parameters:

  # ---------------------------------------------------------------------------
  # Organization Naming

  OrgPrefix:
    Type: String
    Description: "Organization-level prefix prepended to managed policy names for identification and grouping. For example, 'ACME' would produce policy names like 'ACME-ProjectPipeline-CodeBuildCrud'."
    AllowedPattern: "^[A-Z][A-Z0-9-]{0,18}[A-Z0-9]$"
    MinLength: 2
    MaxLength: 20
    ConstraintDescription: "2 to 20 characters. Upper case alphanumeric and dashes. Must start with a letter and end with a letter or number."

  # ---------------------------------------------------------------------------
  # IAM Configuration

  RolePath:
    Type: String
    Description: "Path to use for IAM Managed Policies created by this template. Use to organize policies within your IAM structure."
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"
    ConstraintDescription: "May only contain alphanumeric characters, forward slashes, underscores, and dashes. Must begin and end with a slash."

  # ---------------------------------------------------------------------------
  # Module Source

  S3ModuleLocation:
    Type: String
    Description: "S3 bucket name containing module snippets. Modules are loaded from s3://<S3ModuleLocation>/<S3ModuleNamespace>/templates/v2/modules/*. Regional buckets provided by 63klabs: 63klabs-atlas-us-east-1, 63klabs-zenith-us-east-2, 63klabs-fabric-us-west-1, 63klabs-orbit-us-west-2. Admins must supply their own bucket if deploying outside us-*"
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    MinLength: 3
    MaxLength: 63
    ConstraintDescription: "Must be a valid S3 bucket name between 3 and 63 characters containing only lowercase letters, numbers, and hyphens."

  S3ModuleNamespace:
    Type: String
    Description: "Namespace prefix within the S3 module bucket. This is the path prefix where modules are stored. Modules are loaded from s3://<BucketName>/<S3ModuleNamespace>/templates/v2/modules/*"
    Default: "atlantis"
    AllowedPattern: "^[a-z0-9][a-z0-9\\-]*(\\/[a-z0-9][a-z0-9\\-]*)*$"
    MinLength: 1
    MaxLength: 128
    ConstraintDescription: "Must be 1 to 128 characters containing only lowercase alphanumeric characters, hyphens, and forward slashes. Must not start or end with a slash. Each segment between slashes must start with a lowercase alphanumeric character."

  # ---------------------------------------------------------------------------
  # GitHub Connection

  GitHubOrg:
    Type: String
    Description: "GitHub organization or username to connect to. Leave empty to skip creating a GitHub connection."
    Default: ""

  # ---------------------------------------------------------------------------
  # API Gateway

  EnableApiGwCloudWatchLogs:
    Type: String
    Description: "Set to 'true' to create the account-level IAM role and API Gateway Account configuration required for API Gateway to push logs to CloudWatch. This is a one-time, per-account, per-region setup."
    Default: "true"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  # ---------------------------------------------------------------------------
  # S3 Artifacts Bucket

  EnableS3ArtifactsBucket:
    Type: String
    Description: "Set to 'true' to create a shared, account-wide S3 artifacts bucket for pipeline build artifacts. This bucket is accessible by all pipeline roles in the account."
    Default: "true"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  S3BucketNameOrgPrefix:
    Type: String
    Description: "Optional lowercase organization prefix prepended to the S3 artifacts bucket name for uniqueness. Leave empty to omit. Example: 'acme' would produce 'acme-cf-artifacts-123456789012-us-east-1-an'."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,18}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty or 2 to 20 characters (8 or less recommended). Lower case alphanumeric and dashes. Must start and end with a letter or number."

  S3LogBucketName:
    Type: String
    Description: "Optional S3 bucket name for server access logging of the artifacts bucket. When set, this bucket takes precedence over the account-wide access log bucket. Leave empty to fall back to the access log bucket (when EnableS3AccessLogBucket is 'true'), or to disable logging entirely (when EnableS3AccessLogBucket is 'false')."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$|^$"
    ConstraintDescription: "Must be a valid S3 bucket name or empty. Must be between 3 and 63 characters long. Lower case alphanumeric and dashes. Must start and end with a letter or number."

  # ---------------------------------------------------------------------------
  # S3 Access Log Bucket

  EnableS3AccessLogBucket:
    Type: String
    Description: "Set to 'true' to create a shared, account-wide S3 bucket for storing S3 server access logs. When enabled, the account-wide artifacts bucket logs to this bucket unless S3LogBucketName is set (an explicitly supplied S3LogBucketName always takes precedence)."
    Default: "true"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  LogExpirationInDays:
    Type: Number
    Description: "The number of days to keep logs under prefixes that use the shared default retention: the 'cloudfront/' prefix on the main access log bucket and the CloudFront legacy logging bucket. Default is 180 days, max is 365. Consider exporting for longer retention. Applies when EnableS3AccessLogBucket or AllowLegacyCloudFrontLogs is 'true'."
    Default: 180
    MinValue: 1
    MaxValue: 365
    ConstraintDescription: "Must be between 1 and 365 days."

  S3AccessLogExpirationInDays:
    Type: Number
    Description: "The number of days to keep S3 server access logs under the 's3access/' prefixes (cf-artifacts, cloudfront-oac, devops, apps) on the main access log bucket. Each sub-prefix has its own lifecycle rule sharing this value, so finer-grained per-type retention can be split out later. Default is 180 days, max is 365. Only applies when EnableS3AccessLogBucket is 'true'."
    Default: 180
    MinValue: 1
    MaxValue: 365
    ConstraintDescription: "Must be between 1 and 365 days."

  AllowLegacyCloudFrontLogs:
    Type: String
    Description: "Set to 'true' to provision a separate, dedicated CloudFront legacy (v1) standard-logging bucket (cloudfront-logs-legacy-*). CloudFront v1 delivers logs using ACL-based delivery, which requires Object Ownership BucketOwnerPreferred (ACLs enabled); because the main access log bucket keeps ACLs disabled for Bedrock S3 delivery, legacy CloudFront logs get their own bucket. Default is 'false'. This is independent of EnableS3AccessLogBucket. For CloudFront standard logging v2 (no ACLs), use the main access log bucket instead (us-east-1 only)."
    Default: "false"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  # ---------------------------------------------------------------------------
  # Bedrock Model Invocation Logs

  EnableBedrockInvocationLogs:
    Type: String
    Description: "Set to 'true' to create the CloudWatch Logs log group and IAM role required for Amazon Bedrock model invocation logging. This is a one-time, per-account, per-region setup. Disabled by default. IMPORTANT: Creating these resources does NOT enable logging. After deployment you must run the AWS CLI command provided in the BedrockModelInvocationLoggingEnableCommand stack output to activate logging, because Amazon Bedrock provides no CloudFormation resource for the logging configuration."
    Default: "false"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  BedrockInvocationLogExpirationInDays:
    Type: Number
    Description: "The number of days to retain Bedrock model invocation logs in CloudWatch Logs. Default is 180 days. Longer retention increases CloudWatch Logs storage cost. Invocation logs contain full prompt and response content, so consider your data retention policy. Only applies when EnableBedrockInvocationLogs is 'true'. Must be one of the retention periods supported by CloudWatch Logs."
    Default: 180
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    ConstraintDescription: "Must be one of the CloudWatch Logs retention values: 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, or 3653."

  BedrockInvocationLogKmsKeyArn:
    Type: String
    Description: "Optional ARN of an existing customer managed KMS key used to encrypt the Bedrock model invocation log group. Leave empty to use CloudWatch Logs default encryption. The key MUST be a symmetric key in the same region, and its key policy MUST grant the logs.<region>.amazonaws.com service principal kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, and kms:Describe*. This template does not create or modify the key or its policy. Only applies when EnableBedrockInvocationLogs is 'true'."
    Default: ""
    AllowedPattern: "^arn:[a-z0-9-]+:kms:[a-z0-9-]+:\\d{12}:(key|alias)\\/.+$|^$"
    MaxLength: 256
    ConstraintDescription: "Must be empty or a valid KMS key or alias ARN, for example arn:aws:kms:us-east-2:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab."

  # ---------------------------------------------------------------------------
  # S3 Bedrock Large Object Logs

  EnableBedrockLargeObjectLogging:
    Type: String
    Description: "Set to 'true' to enable delivery of Bedrock large-object/media invocation payloads (images, video, and any payload over 100 KB) to S3 under the 'bedrock/' prefix. Text and embedding payloads continue to be delivered to CloudWatch Logs. IMPORTANT: like the CloudWatch path, enabling this does NOT activate logging by itself - after deployment you must run the AWS CLI command in the BedrockModelInvocationLoggingEnableCommand output. When 'true', either EnableS3AccessLogBucket must be 'true' or BedrockLargeObjectLogBucketName must be provided (enforced by a template rule)."
    Default: "false"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  BedrockLargeObjectLogExpirationInDays:
    Type: Number
    Description: "The number of days to keep Bedrock large-object/media logs under the 'bedrock/' prefix on the main access log bucket. This is an S3 lifecycle value and is DISTINCT from BedrockInvocationLogExpirationInDays (which is the CloudWatch Logs retention for text/embedding logs). Media payloads can be bulky, so tune this for cost. Default is 90 days, max is 365. Only applies when Bedrock media logging targets the account-wide access log bucket."
    Default: 90
    MinValue: 1
    MaxValue: 365
    ConstraintDescription: "Must be between 1 and 365 days."

  BedrockLargeObjectLogBucketName:
    Type: String
    Description: "Optional S3 bucket name for Bedrock large-object/media log delivery. When set, this bucket takes precedence over the account-wide access log bucket. NOTE: this template cannot attach a policy to an external bucket, so you must manually add a bucket policy allowing the bedrock.amazonaws.com service principal s3:PutObject on the 'bedrock/AWSLogs/<account>/BedrockModelInvocationLogs/*' prefix. Leave empty to use the account-wide access log bucket (requires EnableS3AccessLogBucket 'true')."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$|^$"
    ConstraintDescription: "Must be a valid S3 bucket name or empty. Must be between 3 and 63 characters long. Lower case alphanumeric and dashes. Must start and end with a letter or number."

  # ---------------------------------------------------------------------------
  # Promotion

  PromotionSourceAccountIds:
    Type: CommaDelimitedList
    Description: "Optional list of AWS account IDs permitted to write cross-account promotion artifacts to the account-wide artifacts bucket. When set, a bucket policy statement grants the listed accounts' *-PromoteServiceRole roles write/read access scoped to the promotions/* prefix only. Leave empty to omit the cross-account statement entirely."
    Default: ""

  EnablePromotionTrigger:
    Type: String
    Description: "Set to 'true' to let this account's artifacts bucket automatically trigger receiving (promotion) pipelines when a promoted artifact arrives. Enable this on the receiving account when using same-account or cross-account promotion. (Under the hood this turns on S3 EventBridge notifications on the bucket, which the promotion source event rule depends on.) Default is 'true'."
    Default: "true"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

# =============================================================================
# CONDITIONS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference-conditions.html
#

Conditions:
  HasGitHubOrg: !Not [!Equals [!Ref GitHubOrg, ""]]
  EnableApiGatewayLogging: !Equals [!Ref EnableApiGwCloudWatchLogs, "true"]
  EnableS3ArtifactsBucket: !Equals [!Ref EnableS3ArtifactsBucket, "true"]
  UseS3BucketNameOrgPrefix: !Not [!Equals [!Ref S3BucketNameOrgPrefix, ""]]
  HasLoggingBucket: !Not [!Equals [!Ref S3LogBucketName, ""]]
  EnableS3AccessLogBucket: !Equals [!Ref EnableS3AccessLogBucket, "true"]
  EnableLegacyCloudFrontLogs: !Equals [!Ref AllowLegacyCloudFrontLogs, "true"]
  HasPromotionSourceAccounts: !Not [!Equals [!Join ["", !Ref PromotionSourceAccountIds], ""]]
  EnablePromotionTrigger: !Equals [!Ref EnablePromotionTrigger, "true"]
  EnableBedrockInvocationLogs: !Equals [!Ref EnableBedrockInvocationLogs, "true"]
  HasBedrockInvocationLogKmsKey: !Not [!Equals [!Ref BedrockInvocationLogKmsKeyArn, ""]]
  EnableBedrockLargeObjectLogging: !Equals [!Ref EnableBedrockLargeObjectLogging, "true"]
  HasBedrockLargeObjectLogBucket: !Not [!Equals [!Ref BedrockLargeObjectLogBucketName, ""]]
  # Bedrock media targets the account-wide main access log bucket (not an external bucket):
  BedrockMediaToAccountBucket: !And
    - !Equals [!Ref EnableBedrockLargeObjectLogging, "true"]
    - !Equals [!Ref BedrockLargeObjectLogBucketName, ""]
    - !Equals [!Ref EnableS3AccessLogBucket, "true"]

# =============================================================================
# RULES
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/rules-section-structure.html
#

Rules:
  BedrockMediaRequiresDestination:
    RuleCondition: !Equals [!Ref EnableBedrockLargeObjectLogging, "true"]
    Assertions:
      - Assert: !Or
          - !Equals [!Ref EnableS3AccessLogBucket, "true"]
          - !Not [!Equals [!Ref BedrockLargeObjectLogBucketName, ""]]
        AssertDescription: "When EnableBedrockLargeObjectLogging is 'true', either EnableS3AccessLogBucket must be 'true' or BedrockLargeObjectLogBucketName must be provided."
  BedrockMediaRequiresInvocationLogs:
    RuleCondition: !Equals [!Ref EnableBedrockLargeObjectLogging, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableBedrockInvocationLogs, "true"]
        AssertDescription: "When EnableBedrockLargeObjectLogging is 'true', EnableBedrockInvocationLogs must also be 'true' - large-object (media) delivery is configured within cloudWatchConfig.largeDataDeliveryS3Config, which requires the Bedrock CloudWatch log group and role."

# =============================================================================
# RESOURCES
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
#

Resources:

  # -- CodeBuild and Logs CRUD Policy (ABAC-Scoped) --
  CloudFormationCodeBuildPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/pipeline-policies/codebuild-crud.yml"

  # -- Cognito User Pool CRUD Policy (ABAC-Scoped) --
  CloudFormationCognitoPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/pipeline-policies/cognito-crud.yml"

  # -- GitHub Connection (Conditional) --
  GitHubConnection:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/codeconnections-github.yml"

  # -- API Gateway CloudWatch Role (Conditional) --
  ApiGatewayCloudWatchLogsRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/apigw-cloudwatch-role.yml"

  # -- API Gateway Account Configuration (Conditional) --
  ApiGatewayAccount:
    DependsOn: ApiGatewayCloudWatchLogsRole
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/apigw-cloudwatch-account.yml"

  # -- Bedrock Model Invocation Log Group (Conditional) --
  BedrockModelInvocationLogGroup:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/bedrock-cloudwatch-log-group.yml"

  # -- Bedrock CloudWatch Logs Role (Conditional) --
  # No DependsOn: the role's inline policy constructs the log group ARN as a string
  # rather than referencing the log group resource, so the two are independent.
  BedrockCloudWatchLogsRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/bedrock-cloudwatch-role.yml"

  # -- S3 Access Log Bucket (Conditional) --
  AccessLogBucketRegional:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/s3-access-logs/s3-access-log-bucket.yml"

  # -- S3 Access Log Bucket Policy (Conditional) --
  AccessLogBucketPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/s3-access-logs/s3-access-log-bucket-policy.yml"

  # -- CloudFront Legacy (v1) Log Bucket (Conditional: EnableLegacyCloudFrontLogs) --
  CloudFrontLegacyLogBucket:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/s3-access-logs/cloudfront-legacy-log-bucket.yml"

  # -- CloudFront Legacy (v1) Log Bucket Policy (Conditional: EnableLegacyCloudFrontLogs) --
  CloudFrontLegacyLogBucketPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/s3-access-logs/cloudfront-legacy-log-bucket-policy.yml"

  # -- S3 Artifacts Bucket (Conditional) --
  # No explicit DependsOn on the access log resources: when the artifacts bucket logs to
  # the account-wide access log bucket (EnableS3AccessLogBucket 'true' and S3LogBucketName
  # empty), its LoggingConfiguration uses Ref AccessLogBucketRegional, which creates an
  # implicit dependency so the log bucket is created first. That Ref only exists in that
  # branch of the Fn::If, so otherwise there is no reference to the (uncreated) log
  # resources and nothing to order.
  S3ArtifactsBucketRegional:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/s3-artifacts-bucket.yml"

  # -- S3 Artifacts Bucket Policy (Conditional) --
  S3ArtifactBucketPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/account-wide/s3-artifacts-bucket-policy.yml"

# =============================================================================
# OUTPUTS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
#
# Place anything interesting that you would like to quickly refer to in
# your cloudformation OUTPUT section. Test URLs, direct links to resources, etc
#

Outputs:

  # ---------------------------------------------------------------------------
  # CodeBuild CRUD Policy

  CodeBuildCrudPolicyArn:
    Description: "ARN of the CodeBuild CRUD managed policy. Pass this to pipeline templates via the CloudFormationSvcRoleIncludeManagedPolicyArns parameter."
    Value: !Ref CloudFormationCodeBuildPolicy
    Export:
      Name: !Sub "${OrgPrefix}-ProjectPipeline-CodeBuildCrud-Arn"

  CodeBuildCrudPolicyName:
    Description: "Name of the CodeBuild CRUD managed policy"
    Value: !Sub "${OrgPrefix}-ProjectPipeline-CodeBuildCrud"

  # ---------------------------------------------------------------------------
  # Cognito CRUD Policy

  CognitoCrudPolicyArn:
    Description: "ARN of the Cognito CRUD managed policy. Pass this to pipeline templates via the CloudFormationSvcRoleIncludeManagedPolicyArns parameter."
    Value: !Ref CloudFormationCognitoPolicy
    Export:
      Name: !Sub "${OrgPrefix}-ProjectPipeline-CognitoCrud-Arn"

  CognitoCrudPolicyName:
    Description: "Name of the Cognito CRUD managed policy"
    Value: !Sub "${OrgPrefix}-ProjectPipeline-CognitoCrud"

  # ---------------------------------------------------------------------------
  # GitHub Connection

  GitHubConnectionArn:
    Condition: HasGitHubOrg
    Description: "ARN of the GitHub connection. Pass this to pipeline templates via GitHubConnectionArn. Note: You must manually complete the connection in the AWS Console."
    Value: !Ref GitHubConnection
    Export:
      Name: !Sub "${OrgPrefix}-GitHub-Connection-Arn"

  GitHubConnectionStatus:
    Condition: HasGitHubOrg
    Description: "Status of the GitHub connection (PENDING until manually authorized)"
    Value: !GetAtt GitHubConnection.ConnectionStatus

  CodeConnectionsConsole:
    Condition: HasGitHubOrg
    Description: "URL to complete the GitHub connection setup in the AWS Console"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/settings/connections"

  # ---------------------------------------------------------------------------
  # API Gateway CloudWatch Logging

  ApiGatewayCloudWatchLogsRoleArn:
    Condition: EnableApiGatewayLogging
    Description: "ARN of the IAM role used by API Gateway to push logs to CloudWatch"
    Value: !GetAtt ApiGatewayCloudWatchLogsRole.Arn
    Export:
      Name: !Sub "${OrgPrefix}-ApiGateway-CloudWatch-Role-Arn"

  # ---------------------------------------------------------------------------
  # Bedrock Model Invocation Logging

  BedrockModelInvocationLogGroupName:
    Condition: EnableBedrockInvocationLogs
    Description: "Name of the CloudWatch log group that receives Bedrock model invocation logs. Supply this as cloudWatchConfig.logGroupName when activating model invocation logging."
    Value: !Ref BedrockModelInvocationLogGroup
    Export:
      Name: !Sub "${OrgPrefix}-Bedrock-CloudWatch-LogGroup-Name"

  BedrockModelInvocationLogGroupArn:
    Condition: EnableBedrockInvocationLogs
    Description: "ARN of the CloudWatch log group that receives Bedrock model invocation logs"
    Value: !GetAtt BedrockModelInvocationLogGroup.Arn
    Export:
      Name: !Sub "${OrgPrefix}-Bedrock-CloudWatch-LogGroup-Arn"

  BedrockCloudWatchLogsRoleArn:
    Condition: EnableBedrockInvocationLogs
    Description: "ARN of the IAM role Amazon Bedrock assumes to publish model invocation logs to CloudWatch. Supply this as cloudWatchConfig.roleArn when activating model invocation logging."
    Value: !GetAtt BedrockCloudWatchLogsRole.Arn
    Export:
      Name: !Sub "${OrgPrefix}-Bedrock-CloudWatch-Role-Arn"

  BedrockModelInvocationLoggingEnableCommand:
    Condition: EnableBedrockInvocationLogs
    Description: "REQUIRED MANUAL STEP: run this AWS CLI command to activate Bedrock model invocation logging: aws bedrock put-model-invocation-logging-configuration --region <REGION> --logging-config '<this value>'. Deploying this stack alone does not enable logging. Text and embedding delivery are always enabled. When EnableBedrockLargeObjectLogging is 'true', image and video (large binary) delivery is enabled via cloudWatchConfig.largeDataDeliveryS3Config to the 'bedrock/' prefix; otherwise image and video are disabled (CloudWatch Logs cannot carry binary payloads without an S3 large data delivery target). Must be run once per region."
    Value: !If
      - EnableBedrockLargeObjectLogging
      - !Sub
        - '{"cloudWatchConfig":{"logGroupName":"${BedrockModelInvocationLogGroup}","roleArn":"${BedrockCloudWatchLogsRole.Arn}","largeDataDeliveryS3Config":{"bucketName":"${MediaBucket}","keyPrefix":"bedrock"}},"textDataDeliveryEnabled":true,"embeddingDataDeliveryEnabled":true,"imageDataDeliveryEnabled":true,"videoDataDeliveryEnabled":true}'
        - MediaBucket: !If [HasBedrockLargeObjectLogBucket, !Ref BedrockLargeObjectLogBucketName, !Ref AccessLogBucketRegional]
      - !Sub '{"cloudWatchConfig":{"logGroupName":"${BedrockModelInvocationLogGroup}","roleArn":"${BedrockCloudWatchLogsRole.Arn}"},"textDataDeliveryEnabled":true,"embeddingDataDeliveryEnabled":true,"imageDataDeliveryEnabled":false,"videoDataDeliveryEnabled":false}'

  BedrockModelInvocationLogGroupConsole:
    Condition: EnableBedrockInvocationLogs
    Description: "CloudWatch console link to the Bedrock model invocation log group"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Faws$252Fbedrock$252F${OrgPrefix}-ModelInvocations"

  # ---------------------------------------------------------------------------
  # S3 Artifacts Bucket

  S3ArtifactsBucketName:
    Condition: EnableS3ArtifactsBucket
    Description: "Name of the S3 artifacts bucket for pipeline build artifacts"
    Value: !Ref S3ArtifactsBucketRegional
    Export:
      Name: !Sub "${OrgPrefix}-S3-Artifacts-Bucket-Name"

  S3ArtifactsBucketConsole:
    Condition: EnableS3ArtifactsBucket
    Description: "S3 console link for the artifacts bucket"
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${S3ArtifactsBucketRegional}"

  # ---------------------------------------------------------------------------
  # S3 Access Log Bucket

  S3AccessLogBucketName:
    Condition: EnableS3AccessLogBucket
    Description: "Name of the account-wide S3 access log bucket"
    Value: !Ref AccessLogBucketRegional
    Export:
      Name: !Sub "${OrgPrefix}-S3-AccessLog-Bucket-Name"

  S3AccessLogBucketArn:
    Condition: EnableS3AccessLogBucket
    Description: "ARN of the account-wide S3 access log bucket"
    Value: !GetAtt AccessLogBucketRegional.Arn
    Export:
      Name: !Sub "${OrgPrefix}-S3-AccessLog-Bucket-Arn"

  S3AccessLogBucketConsole:
    Condition: EnableS3AccessLogBucket
    Description: "S3 console link for the access log bucket"
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${AccessLogBucketRegional}"

  # ---------------------------------------------------------------------------
  # CloudFront Legacy (v1) Log Bucket

  CloudFrontLegacyLogBucketName:
    Condition: EnableLegacyCloudFrontLogs
    Description: "Name of the account-wide CloudFront legacy (v1) standard-logging bucket. Supply as the CloudFront logging destination (or import this export) when using CloudFront standard logging v1."
    Value: !Ref CloudFrontLegacyLogBucket
    Export:
      Name: !Sub "${OrgPrefix}-CloudFront-Legacy-Log-Bucket-Name"

  CloudFrontLegacyLogBucketArn:
    Condition: EnableLegacyCloudFrontLogs
    Description: "ARN of the account-wide CloudFront legacy (v1) standard-logging bucket"
    Value: !GetAtt CloudFrontLegacyLogBucket.Arn
    Export:
      Name: !Sub "${OrgPrefix}-CloudFront-Legacy-Log-Bucket-Arn"

  CloudFrontLegacyLogBucketConsole:
    Condition: EnableLegacyCloudFrontLogs
    Description: "S3 console link for the CloudFront legacy log bucket"
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${CloudFrontLegacyLogBucket}"

  # ---------------------------------------------------------------------------
  # Console Links

  IamPoliciesConsole:
    Description: "IAM Policies in AWS Console"
    Value: "https://console.aws.amazon.com/iam/home#/policies"
