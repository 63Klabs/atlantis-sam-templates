AWSTemplateFormatVersion: "2010-09-09"
Description: "Combined prefix-based IAM Service Roles and Managed Policies for Pipeline and Storage management - Assembled from reusable modules"

# 63Klabs Atlantis DevOps Platform for AWS SAM Deployments
# Prefix-Based Infrastructure Template
# Author: Chad Kluck - 63klabs.net
# Version: v0.0.2/2026-08-10

# Documentation, Issues/Feature Requests, Latest Updates, and Security Reports on GitHub:
# https://github.com/63klabs/atlantis-sam-templates/

# This template combines service roles and resources used for supporting applications
# deployed using the 63Klabs Atlantis DevOps Platform into a single stack. 
# It uses reusable modules (snippets) stored in S3 via AWS::Include.
# AWS::Include must point to a local file or an S3 bucket in the same region as stack deployment.
# Use the regional bucket names listed below or provide your own local or hosted copy.

# S3 Module Location (S3ModuleLocation):
# 63klabs-atlas-us-east-1
# 63klabs-atlas-us-east-2
# 63klabs-atlas-us-west-1
# 63klabs-atlas-us-west-2

# Each module creates:
#   - A CloudFormation service role (assumed by cloudformation.amazonaws.com)
#   - A managed policy that grants iam:PassRole for that service role
#   - Cache-Data storage infrastructure for the NPM @63klabs/cache-data package
#
# Both roles are prefix-scoped, restricting actions to resources named
# with the given Prefix.

# =============================================================================
# META DATA
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-interface.html
#

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - E6101 # Resources from AWS::Include modules are not visible to cfn-lint
        - W2001 # Parameters consumed by AWS::Include modules appear unused
        - W8001 # Conditions consumed by AWS::Include modules appear unused
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Application Resource Naming"
        Parameters:
          - Prefix
          - PrefixUpper
          - OrgPrefix
          - S3BucketNameOrgPrefix
          - ServiceRolePath
          - RolePath
      -
        Label:
          default: "External Resources"
        Parameters:
          - PermissionsBoundaryArn
          - S3ArtifactsBucket
      -
        Label:
          default: "Resources to Attach Managed Policies To"
        Parameters:
          - GroupNames
          - UserNames
          - RoleNames
      -
        Label:
          default: "Cache-Data"
        Parameters:
          - EnableCacheData
          - CacheDataPurgeAgeOfCachedBucketObjInDays
          - CreateManagedCacheDataLambdaExecutionRolePolicy
      -
        Label:
          default: "Module Source"
        Parameters:
          - S3ModuleLocation
          - S3ModuleNamespace

# =============================================================================
# PARAMETERS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/parameters-section-structure.html
#

Parameters:

  # ---------------------------------------------------------------------------
  # Application Resource Naming

  Prefix:
    Type: String
    Description: "Prefix pre-pended to all resources. This can be thought of as a Name Space used to identify ownership/access for teams, departments, etc. For example, resources named ws-* could belong to the web service team and could have IAM permissions to allow access to other ws-* resources. The Prefix must have a corresponding CloudFormation Service Role. Short, descriptive 2-6 character values work best. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: "acme"
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  PrefixUpper:
    Type: String
    Description: "Prefix for Service Role in all UPPER CASE."
    Default: "ACME"
    AllowedPattern: "^[A-Z][A-Z0-9-]{0,6}[A-Z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. UPPER case alphanumeric and dashes. Must start with a letter and end with a letter or number."

  OrgPrefix:
    Type: String
    Description: "Organization-level prefix (UPPER CASE) used to resolve the account-wide S3 artifacts bucket export '<OrgPrefix>-S3-Artifacts-Bucket-Name' from account-wide-infrastructure. This is DISTINCT from PrefixUpper (the team/namespace prefix). Only required when S3ArtifactsBucket is left empty so the bucket name is imported from the account-wide stack. Leave empty if you supply S3ArtifactsBucket directly."
    Default: ""
    AllowedPattern: "^[A-Z][A-Z0-9-]{0,18}[A-Z0-9]$|^$"
    MaxLength: 20
    ConstraintDescription: "May be empty, or 2 to 20 characters. UPPER case alphanumeric and dashes. Must start with a letter and end with a letter or number."

  S3BucketNameOrgPrefix:
    Type: String
    Description: "By default, to enforce uniqueness, buckets include account and region in the bucket name. However, due to character limits, you can specify your own S3 prefix (like an org code). This will be used in addition to the Prefix entered above. Note that this length is shared with the recommended length of 20 characters for Resource Identifiers. So if you have a 10 character S3BucketNameOrgPrefix, you are limited to 10 characters for your bucket name identifier in your templates. Buckets are named <Prefix>-<Region>-<AccountId>-<ProjectId>-<StageId>-<ResourceId> or <S3OrgPrefix>-<Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,18}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty or 2 to 20 characters (8 or less recommended). Lower case alphanumeric and dashes. Must start and end with a letter or number."

  ServiceRolePath:
    Type: String
    Description: "Path to use for the Service Roles and Managed Policies. You may wish to provide a path to organize and base permissions on."
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"
    ConstraintDescription: "May only contain alphanumeric characters, forward slashes, underscores, and dashes. Must begin and end with a slash."

  RolePath:
    Type: String
    Description: "Application Role Path to use for IAM Roles and Policies for Applications. You may wish to separate out your applications from users, or create separate paths per prefix or application. Specific paths may required by permission boundaries. Ex: /ws-hello-world-test/ or /app_role/"
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"
    ConstraintDescription: "May only contain alphanumeric characters, forward slashes, underscores, and dashes. Must begin and end with a slash."

  # ---------------------------------------------------------------------------
  # External Resources

  PermissionsBoundaryArn:
    Type: String
    Description: "Permissions Boundary is a policy attached to a role to further restrict the permissions of the role. Your organization may or may not require boundaries. If left empty, no permissions boundary will be used."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[\\w+=,.@\\-\\/]*[\\w+=,.@\\-]+$"
    ConstraintDescription: "Must be empty or a valid IAM Policy ARN in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  S3ArtifactsBucket:
    Type: String
    Description: "DEPRECATED: Name of the existing S3 artifacts bucket used by managed stacks. This value is now derived automatically from the account-wide export '<OrgPrefix>-S3-Artifacts-Bucket-Name'. Supplying it here overrides the export and is retained only for backward compatibility. Encouraged usage: leave empty and set OrgPrefix so the name is imported from account-wide-infrastructure. Service roles are granted s3:GetObject and s3:GetObjectVersion on keys prefixed with <Prefix>-* within this bucket."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$|^$"
    MaxLength: 63
    ConstraintDescription: "Must be empty or a valid S3 bucket name between 3 and 63 characters containing only lowercase letters, numbers, and hyphens."

  # ---------------------------------------------------------------------------
  # Resources to Attach Managed Policies To

  GroupNames:
    Type: CommaDelimitedList
    Description: "Optional. Friendly Name (not ARN) of an existing IAM Group to attach the managed policies to. If left empty, no group will be attached."
    Default: ""
    AllowedPattern: "^[\\w+=,_.@\\-]+$|^$"
    ConstraintDescription: "Must be empty or a comma delimited list of valid IAM Group names."

  RoleNames:
    Type: CommaDelimitedList
    Description: "Optional. Friendly Name (not ARN) of an existing IAM Role to attach the managed policies to. If left empty, no role will be attached."
    Default: ""
    AllowedPattern: "^[\\w+=,_.@\\-]+$|^$"
    ConstraintDescription: "Must be empty or a comma delimited list of valid IAM Role names."

  UserNames:
    Type: CommaDelimitedList
    Description: "Optional. Friendly Name (not ARN) of an existing IAM User to attach the managed policies to. If left empty, no user will be attached."
    Default: ""
    AllowedPattern: "^[\\w+=,_.@\\-]+$|^$"
    ConstraintDescription: "Must be empty or a comma delimited list of valid IAM User names."

  # ---------------------------------------------------------------------------
  # Cache-Data

  EnableCacheData:
    Type: String
    Description: "Set to 'true' to create the shared, prefix-wide Cache-Data resources (DynamoDB table, S3 bucket, bucket policy, and optional managed Lambda execution policy). See https://www.npmjs.com/package/@63klabs/cache-data"
    Default: "false"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must be 'true' or 'false'."

  CacheDataPurgeAgeOfCachedBucketObjInDays:
    Type: Number
    Description: "Similar to CacheData_PurgeExpiredCacheEntriesInHours, but for the S3 Bucket. S3 calculates from time object is created/last modified (not accessed). This should be longer than your longest cache expiration set in custom/policies. Keeping objects in S3 for too long increases storage costs. (30 is recommended)"
    Default: 15
    MinValue: 3
    ConstraintDescription: "Choose a value of 3 days or greater. This should be slightly longer than the longest cache expiration expected"

  CreateManagedCacheDataLambdaExecutionRolePolicy:
    Type: String
    Description: "Create a managed Lambda Execution Role Policy for accessing Cache-Data. Set to FALSE to supply your own policy for the Lambda Execution Role. Only applies when EnableCacheData is 'true'."
    AllowedValues: ["TRUE", "FALSE"]
    Default: "TRUE"

  # ---------------------------------------------------------------------------
  # Module Source

  S3ModuleLocation:
    Type: String
    Description: "S3 bucket name containing module snippets. Modules are loaded from s3://<S3ModuleLocation>/<S3ModuleNamespace>/templates/v2/modules/*. Bucket must be in same region as deployment. Regional buckets provided by 63klabs: 63klabs-atlas-us-east-1, 63klabs-zenith-us-east-2, 63klabs-fabric-us-west-1, 63klabs-orbit-us-west-2. Admins must supply their own bucket if deploying outside us-*"
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    MinLength: 3
    MaxLength: 63
    ConstraintDescription: "Must be a valid S3 bucket name between 3 and 63 characters containing only lowercase letters, numbers, and hyphens."

  S3ModuleNamespace:
    Type: String
    Description: "Namespace prefix within the S3 module bucket. This is the path prefix where modules are stored. Modules are loaded from s3://<BucketName>/<S3ModuleNamespace>/templates/v2/modules/*"
    Default: "atlantis"
    AllowedPattern: "^[a-z0-9][a-z0-9\\-]*(\\/[a-z0-9][a-z0-9\\-]*)*$"
    MinLength: 1
    MaxLength: 128
    ConstraintDescription: "Must be 1 to 128 characters containing only lowercase alphanumeric characters, hyphens, and forward slashes. Must not start or end with a slash. Each segment between slashes must start with a lowercase alphanumeric character."

# =============================================================================
# CONDITIONS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference-conditions.html
#

Conditions:
  UseS3BucketNameOrgPrefix: !Not [!Equals [!Ref S3BucketNameOrgPrefix, ""]]
  HasS3ArtifactsBucketOverride: !Not [!Equals [!Ref S3ArtifactsBucket, ""]]
  HasPermissionsBoundaryArn: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasGroupNames: !Not [!Equals [!Join ["", !Ref GroupNames], ""]]
  HasRoleNames: !Not [!Equals [!Join ["", !Ref RoleNames], ""]]
  HasUserNames: !Not [!Equals [!Join ["", !Ref UserNames], ""]]
  CreateCacheData: !Equals [!Ref EnableCacheData, "true"]
  CreateCacheDataManagedPolicy: !And
    - !Condition CreateCacheData
    - !Equals [!Ref CreateManagedCacheDataLambdaExecutionRolePolicy, "TRUE"]

# =============================================================================
# RESOURCES
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
#

Resources:

  # -- Pipeline Management --
  PrefixBasedCloudFormationPipelineMgmtServiceRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/pipeline-mgmt-role.yml"

  PrefixBasedPipelineMgmtManagedPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/pipeline-mgmt-passrole-policy.yml"

  # -- Storage Management --
  PrefixBasedCloudFormationStorageMgmtServiceRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/storage-mgmt-role.yml"

  PrefixBasedStorageMgmtManagedPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/storage-mgmt-passrole-policy.yml"

  # -- Network CloudFront Management Policy --
  PrefixBasedNetworkCloudFrontMgmtPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-cloudfront-mgmt-policy.yml"

  # -- Network Route53 Management Policy --
  PrefixBasedNetworkRoute53MgmtPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-route53-mgmt-policy.yml"

  # -- Network CloudFront Management Role (Developer) --
  PrefixBasedCloudFormationNetworkCloudFrontMgmtServiceRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-cloudfront-mgmt-role.yml"

  PrefixBasedNetworkCloudFrontMgmtManagedPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-cloudfront-mgmt-passrole-policy.yml"

  # -- Full Network Management Role (CloudFront + Route53) --
  PrefixBasedCloudFormationNetworkFullMgmtServiceRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-full-mgmt-role.yml"

  PrefixBasedNetworkFullMgmtManagedPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-full-mgmt-passrole-policy.yml"

  # -- Cache-Data DynamoDb Table (Conditional) --
  CacheDataDynamoDbTable:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/cache-data/cache-dynamodb-table.yml"

  # -- Cache-Data S3 Bucket (Conditional) --
  CacheDataS3BucketRegional:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/cache-data/cache-s3-bucket.yml"

  # -- Cache-Data S3 Bucket Policy (Conditional) --
  CacheDataS3BucketPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/cache-data/cache-s3-bucket-policy.yml"

  # -- Cache-Data Managed Lambda Execution Policy (Conditional) --
  ManagedLambdaExecutionRolePolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/cache-data/cache-managed-lambda-policy.yml"

# =============================================================================
# OUTPUTS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
#
# Place anything interesting that you would like to quickly refer to in
# your cloudformation OUTPUT section. Test URLs, direct links to resources, etc
#

Outputs:

  # ---------------------------------------------------------------------------
  # Pipeline Management

  PipelineMgmtServiceRoleArn:
    Description: "The ARN of the Prefix-based CloudFormation Service Role for Pipeline Management"
    Value: !GetAtt PrefixBasedCloudFormationPipelineMgmtServiceRole.Arn
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Pipeline-Mgmt-Service-Role-Arn"

  PipelineMgmtServiceRoleName:
    Description: "The Name of the Prefix-based CloudFormation Service Role for Pipeline Management"
    Value: !Ref PrefixBasedCloudFormationPipelineMgmtServiceRole
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Pipeline-Mgmt-Service-Role-Name"

  # ---------------------------------------------------------------------------
  # Storage Management

  StorageMgmtServiceRoleArn:
    Description: "The ARN of the Prefix-based CloudFormation Service Role for Storage Management"
    Value: !GetAtt PrefixBasedCloudFormationStorageMgmtServiceRole.Arn
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Storage-Mgmt-Service-Role-Arn"

  StorageMgmtServiceRoleName:
    Description: "The Name of the Prefix-based CloudFormation Service Role for Storage Management"
    Value: !Ref PrefixBasedCloudFormationStorageMgmtServiceRole
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Storage-Mgmt-Service-Role-Name"

  # ---------------------------------------------------------------------------
  # Network CloudFront Management (Developer)

  NetworkCloudFrontMgmtServiceRoleArn:
    Description: "The ARN of the Network CloudFront Management Service Role (no Route53)"
    Value: !GetAtt PrefixBasedCloudFormationNetworkCloudFrontMgmtServiceRole.Arn
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-CloudFront-Mgmt-Service-Role-Arn"

  NetworkCloudFrontMgmtServiceRoleName:
    Description: "The Name of the Network CloudFront Management Service Role"
    Value: !Ref PrefixBasedCloudFormationNetworkCloudFrontMgmtServiceRole
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-CloudFront-Mgmt-Service-Role-Name"

  # ---------------------------------------------------------------------------
  # Full Network Management (CloudFront + Route53)

  NetworkFullMgmtServiceRoleArn:
    Description: "The ARN of the Full Network Management Service Role (CloudFront + Route53)"
    Value: !GetAtt PrefixBasedCloudFormationNetworkFullMgmtServiceRole.Arn
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-Full-Mgmt-Service-Role-Arn"

  NetworkFullMgmtServiceRoleName:
    Description: "The Name of the Full Network Management Service Role"
    Value: !Ref PrefixBasedCloudFormationNetworkFullMgmtServiceRole
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-Full-Mgmt-Service-Role-Name"
  # ---------------------------------------------------------------------------
  # Cache-Data

  CacheDataDynamoDbWebConsole:
    Condition: CreateCacheData
    Description: "DynamoDb Table Web Console"
    Value: !Sub "https://console.aws.amazon.com/dynamodbv2/home?region=${AWS::Region}#table?name=${CacheDataDynamoDbTable}&initialTableGroup=%23all"

  CacheDataS3BucketWebConsole:
    Condition: CreateCacheData
    Description: "S3 Bucket Web Console"
    Value: !Sub "https://s3.console.aws.amazon.com/s3/buckets/${CacheDataS3BucketRegional}?region=${AWS::Region}"

  CacheDataDynamoDbTableExport:
    Condition: CreateCacheData
    Description: "DynamoDb Table Name"
    Value: !Ref CacheDataDynamoDbTable
    Export:
      Name: !Sub '${Prefix}-CacheDataDynamoDbTable'

  CacheDataS3BucketExport:
    Condition: CreateCacheData
    Description: "S3 Bucket Name"
    Value: !Ref CacheDataS3BucketRegional
    Export:
      Name: !Sub '${Prefix}-CacheDataS3Bucket'

  CacheDataS3BucketArnExport:
    Condition: CreateCacheData
    Description: "S3 Bucket ARN"
    Value: !Sub "arn:aws:s3:::${CacheDataS3BucketRegional}"
    Export:
      Name: !Sub '${Prefix}-CacheDataS3BucketArn'

  CacheDataDynamoDbTableArnExport:
    Condition: CreateCacheData
    Description: "DynamoDb Table ARN"
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CacheDataDynamoDbTable}"
    Export:
      Name: !Sub '${Prefix}-CacheDataDynamoDbTableArn'

  CacheDataManagedLambdaExecutionRolePolicyArn:
    Condition: CreateCacheDataManagedPolicy
    Description: "Managed policy ARN for Lambda Execution Role to access Cache-Data resources"
    Value: !Ref ManagedLambdaExecutionRolePolicy
    Export:
      Name: !Sub '${Prefix}-CacheDataManagedLambdaExecutionRolePolicy'
